# Copyright 2018-2026 the Deno authors. MIT license.
# Standalone copy of ext/fs from denoland/deno v2.9.7, with the workspace
# dependency versions pinned explicitly and rand bumped to 0.8.6.
# See NOTICE.md.

[package]
name = "deno_fs"
version = "0.169.0"
authors = ["the Deno authors"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/frontal-labs/deno_fs"
description = "Ops for interacting with the file system (Frontal Labs fork)"

[lib]
path = "src/lib.rs"

[features]
sync_fs = ["deno_maybe_sync/sync"]

[dependencies]
async-trait = "0.1.73"
boxed_error = "0.2.3"
deno_core = "0.412.0"
deno_error = "=0.7.1"
deno_io = "0.169.0"
deno_maybe_sync = "0.46.0"
deno_path_util = "=0.6.4"
deno_permissions = "0.118.0"
filetime = "0.2.16"
libc = "0.2.168"
rand = "=0.8.6"
rayon = "1.11.0"
same-file = "1.0.6"
serde = { version = "1.0.149", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["fs", "user"] }

[target.'cfg(windows)'.dependencies]
junction = "=1.2.0"
windows-sys = { version = "0.59.0", features = ["Win32_Storage_FileSystem"] }
